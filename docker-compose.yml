# Joins an existing reverse-proxy network so the proxy can reach this app by
# service name ("kanban:8000"). Set PROXY_NETWORK and KANBAN_PASSWORD in .env (see .env.example).
# The login is one shared password, not accounts -- keep the proxy route restricted to trusted
# networks too (defense in depth, not a substitute for the login).
services:
  kanban:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}   # deploy.sh sets this to the git commit
    container_name: kanban
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    environment:
      TZ: ${TZ:-UTC}
      KANBAN_PASSWORD: ${KANBAN_PASSWORD:?set KANBAN_PASSWORD in .env}
    volumes:
      # Markdown files live here; a rebuild never touches them.
      - kanban-data:/data
    networks: [proxy]

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?set PROXY_NETWORK in .env}

volumes:
  kanban-data:

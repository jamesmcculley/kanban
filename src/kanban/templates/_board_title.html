{% from "_icons.html" import icon %}
{% if not display.hide_board_title %}
<form class="title-form" hx-post="{{ url_for('boards.rename_board', slug=board.slug) }}" hx-swap="none"
      hx-on::response-error="location.reload()">
  <input class="board-title" name="title" value="{{ board.title }}" size="{{ [board.title|length, 6]|max }}"
         aria-label="Board name" autocomplete="off"
         onblur="if (this.value !== this.defaultValue) this.form.requestSubmit()">
</form>
{% endif %}
<button type="button" class="icon-btn" title="Duplicate this board" aria-label="Duplicate board"
        data-post="{{ url_for('boards.duplicate_board', slug=board.slug) }}" data-after="navigate">{{ icon('copy') }}</button>
<button type="button" class="icon-btn danger" title="Delete this board" aria-label="Delete board"
        data-post="{{ url_for('boards.delete_board', slug=board.slug) }}" data-confirm="Delete? Click again"
        data-after="home">{{ icon('trash') }}</button>
{% if board.archived %}
<span class="chip" title="Out of the sidebar and search until unarchived">Archived</span>
<button type="button" class="icon-btn" title="Unarchive this board" aria-label="Unarchive board"
        data-post="{{ url_for('boards.unarchive_board', slug=board.slug) }}" data-after="reload">{{ icon('archive') }}</button>
{% else %}
<button type="button" class="icon-btn" title="Archive this board" aria-label="Archive board"
        data-post="{{ url_for('boards.archive_board', slug=board.slug) }}" data-after="reload">{{ icon('archive') }}</button>
{% endif %}
{% if board.kind == 'kanban' %}
<div class="eye-menu-wrap">
  <button type="button" class="icon-btn" data-eye-toggle
          aria-label="Show or hide lists{{ ' (%d hidden)'|format(board.hidden|length) if board.hidden }}"
          title="Show or hide lists{{ ' — %d hidden'|format(board.hidden|length) if board.hidden }}">
    {{ icon('eye') }}
    {% if board.hidden %}<span class="icon-badge">{{ board.hidden|length }}</span>{% endif %}
  </button>
  <div class="eye-menu" hidden>
    <div class="eye-menu-head">
      <span>Lists</span>
      <div class="eye-all">
        <button type="button" class="link-btn" data-eye-all="show">Show all</button>
        <button type="button" class="link-btn" data-eye-all="hide">Hide all</button>
      </div>
    </div>
    {% for col in board.columns %}
    <label class="eye-row">
      <input type="checkbox" class="eye-check" data-url="{{ url_for('boards.hide_column', slug=board.slug) }}"
             data-name="{{ col }}" {% if col not in board.hidden %}checked{% endif %}>
      <span>{{ col }}</span>
    </label>
    {% endfor %}
  </div>
</div>
{% endif %}
<a class="icon-btn" href="{{ url_for('boards.board_settings', slug=board.slug) }}" title="Board settings" aria-label="Board settings">{{ icon('sliders') }}</a>

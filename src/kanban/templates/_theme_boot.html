{# Inline in <head>, before the stylesheets: applies the saved theme before first paint (no flash).
   Same as engineering-standards/templates/theme.js part 1; the list comes from themes.py. #}
<script>
(function () {
  var THEMES = {{ theme_names|tojson }}, SIZES = {{ text_sizes|tojson }};
  window.__THEMES = THEMES;
  try {
    var t = localStorage.getItem('theme');
    if (THEMES.indexOf(t) > -1) document.documentElement.setAttribute('data-theme', t);
    var s = localStorage.getItem('font-size');
    if (SIZES.indexOf(s) > -1) document.documentElement.setAttribute('data-font-size', s);
    var mode = localStorage.getItem('sidebar-mode');
    if (mode === 'hidden') document.documentElement.setAttribute('data-sidebar', mode);
    var width = parseInt(localStorage.getItem('sidebar-width'), 10);
    if (width >= 180 && width <= 420) document.documentElement.style.setProperty('--sidebar-width', width + 'px');
    var hide = JSON.parse(localStorage.getItem('sidebar-hide') || '{}');
    var hidden = Object.keys(hide).filter(function (k) { return hide[k]; });
    if (hidden.length) document.documentElement.setAttribute('data-sidebar-hide', hidden.join(' '));
    var titleHide = JSON.parse(localStorage.getItem('page-title-hide') || '{}');
    var hiddenTitles = Object.keys(titleHide).filter(function (k) { return titleHide[k]; });
    if (hiddenTitles.length) document.documentElement.setAttribute('data-page-title-hide', hiddenTitles.join(' '));
    var todayHide = JSON.parse(localStorage.getItem('today-hide') || '{}');
    var hiddenToday = Object.keys(todayHide).filter(function (k) { return todayHide[k]; });
    if (hiddenToday.length) document.documentElement.setAttribute('data-today-hide', hiddenToday.join(' '));
    // Hiding individual boards (not a whole section) can't use the data-attribute trick above --
    // there's no bounded set of CSS selectors for arbitrary slugs, unlike section visibility's
    // fixed small set of keys. Instead, a <style> tag with one rule per hidden slug, id'd so
    // sidebar.js's HiddenBoards can find and replace it later without a page reload -- same
    // "shared state, updated by two files" pattern as data-sidebar-hide above.
    var boardStyle = document.createElement('style');
    boardStyle.id = 'hidden-boards-css';
    var hiddenBoards = JSON.parse(localStorage.getItem('hidden-boards') || '[]');
    boardStyle.textContent = hiddenBoards.filter(function (s) { return /^[a-z0-9-]+$/.test(s); })
      .map(function (s) { return '.board-row[data-slug="' + s + '"]{display:none}'; }).join('');
    document.head.appendChild(boardStyle);
  } catch (e) { /* storage blocked: keep the default */ }
})();
</script>

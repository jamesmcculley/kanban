<div class="backdrop" onclick="if (event.target === this) this.remove()">
  <form class="dialog" hx-post="{{ url_for('boards.update_card', slug=board.slug, card_id=card.id) }}"
        hx-target="[data-id='{{ card.id }}']" hx-swap="outerHTML"
        hx-on::after-request="if (event.detail.successful) this.closest('.backdrop').remove()"
        hx-on::response-error="this.querySelector('.error').textContent = 'Could not parse the due date or repeat rule.'">
    <input name="title" value="{{ card.title }}" required autofocus>
    <input name="due" value="{{ card.due or '' }}" placeholder="Due: tomorrow, fri, in 3 days, jun 5…">
    <input name="repeat" value="{{ card.repeat or '' }}" placeholder="Repeat: every monday, every 2 weeks, daily…">
    <textarea name="body" rows="8" placeholder="Notes (Markdown)">{{ card.body }}</textarea>
    <p class="error"></p>
    <div class="actions">
      <button type="button" onclick="this.closest('.backdrop').remove()">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</div>

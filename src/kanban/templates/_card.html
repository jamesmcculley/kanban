<div class="card{% if card.done %} done{% endif %}" data-id="{{ card.id }}">
  <input type="checkbox" class="check" {% if card.done %}checked{% endif %} aria-label="Complete"
         hx-post="{{ url_for('boards.complete', slug=board.slug, card_id=card.id) }}"
         hx-target="closest .card" hx-swap="outerHTML">
  <a class="title" href="#" hx-get="{{ url_for('boards.edit_card', slug=board.slug, card_id=card.id) }}"
     hx-target="#modal" hx-swap="innerHTML">{{ card.title }}</a>
  {% if card.repeat %}<span class="repeat" title="{{ card.repeat }}">↻</span>{% endif %}
  {% if card.due %}<span class="due{% if card.due < today and not card.done %} overdue{% endif %}">{{ card.due }}</span>{% endif %}
  <button class="del" hx-delete="{{ url_for('boards.delete_card', slug=board.slug, card_id=card.id) }}"
          hx-target="closest .card" hx-swap="outerHTML" aria-label="Delete card">×</button>
</div>

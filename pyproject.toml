[project]
name = "kanban"
version = "0.1.0"
description = "Local-first kanban backed by Markdown files"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "pyyaml>=6.0",
    "gunicorn>=23.0",
    "markdown-it-py>=4.2.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kanban"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# a personal tool: "today" means the local calendar date, not UTC
ignore = ["DTZ001", "DTZ005", "DTZ006", "DTZ011"]
